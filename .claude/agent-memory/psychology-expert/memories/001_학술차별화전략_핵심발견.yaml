summary: "경쟁 서비스 대비 학술 차별화의 핵심 3요소와 실행 원칙 확립"

context: |
  WF-20260315-비전스코핑 Step 3 작업.
  파운더 비전(docs/memo.md)을 기반으로 심리학적 깊이를 핵심 차별화 요소로 설계.
  경쟁 서비스(16personalities 등)의 학술적 약점 분석 및 대응 전략 수립.

details: |
  ## 경쟁 서비스 핵심 취약점 (3가지)
  1. MBTI 이분법 유형화의 측정 비타당성
     - McCrae & Costa(1989): 성격 차원은 연속 분포, 이분법 절단은 비타당
     - Pittenger(1993): 재검사 시 유형 변경 비율 50%
  2. 바넘 효과(Barnum Effect) 구조적 의존
     - Forer(1949): 모호한 보편적 서술의 자기 확인 편향
     - Dickson & Kelly(1985): 바넘 서술 수용률 평균 74%
  3. 맥락 무시 결정론
     - Mischel & Shoda(1995): CAPS 이론 — 행동은 if-then 상황-행동 프로파일

  ## 학술 차별화 3요소
  1. 측정의 정직성: 이분법 유형 → 연속 스펙트럼 표시
  2. 근거의 투명성: 모든 주장에 "왜 이렇게 말하는가" 명시
  3. 성장 가능성 인정: 성격은 변한다 (Roberts et al., 2006)

  ## 바넘 효과 회피 핵심 기법 (5가지)
  1. 행동 빈도 특정화 (Behavioral Frequency Specification)
  2. 조건부 서술 (Conditional Description)
  3. 대비 집단 제시 (Contrast Group Reference)
  4. 차별적 예측 (Differential Prediction)
  5. 자기 보고와의 비교 유도

  ## 콘텐츠 레이어 구조
  - 레벨 0: 결과 카드 (점수)
  - 레벨 1: 개념 설명
  - 레벨 2: 심층 연구 배경
  - 레벨 3: 실제 논문 링크

  ## 주요 위험 요소
  1. 학술 깊이가 재미를 해치는 시나리오 → opt-in 레이어 구조로 대응
  2. 자기 진단 위험 → 임상 경계 고지 표준화
  3. 유사과학 오인 위험 → 심리학/운명 콘텐츠 명확 분리
  4. 잘못된 인용 (권위에의 호소) → 심리학 에이전트 검증 의무화

  ## Phase 1 최우선 실행 항목
  - 결과 텍스트 바넘 효과 점검 + 학술 근거 태그
  - 임상 경계 고지 컴포넌트 표준화
  - 스펙트럼 시각화 (가장 강력한 단일 차별화 포인트)

implications: |
  1. 모든 유형/성향 서술 텍스트는 이 에이전트의 바넘 효과 검증을 거쳐야 함
  2. db/seeds/ 또는 콘텐츠 DB에 academic_source 필드 추가 필요 (코딩 에이전트에 전달)
  3. 스펙트럼 시각화는 Phase 1 핵심 요소 — UX 에이전트와 협업 필요
  4. 타로/사주 확장(004_Memo의 확장 항목) 시 심리학 콘텐츠와 명확 분리 필수
  5. 콘텐츠 QA 체크리스트에 "임상 용어 사용 여부" 항목 추가 필요

