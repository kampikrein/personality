context: |
  WF-20260315-비전스코핑 Step 4 작업.
  파운더가 memo.md에 정의한 "쇼츠형 스와이프", "캐릭터 인터랙션", "중독적 리텐션" 비전을
  현재 Hotwire/Turbo + Tailwind 스택으로 구현하기 위한 구체적 설계를 수행함.

details: |
  ## 핵심 결정 사항

  ### 1. 콘텐츠 소비 패턴
  카드 스와이프 패턴 채택 (무한 스크롤 아님).
  CSS scroll-snap + Stimulus 조합으로 Phase 1 구현 가능.
  카드 1장 = 8-12초 소비 = 완결적 메시지.
  결과 페이지 카드 시퀀스 7장 설계.

  ### 2. 캐릭터 포지셔닝
  "동반자" 역할 확정. 가이드/챗봇이 아님.
  Phase 1: 일러스트 기반 + Turbo Frame 말풍선 + 조건 분기 매크로.
  Phase 2: AI API 연동 (사용자 성향 컨텍스트 주입).
  Phase 3: 다중 페르소나 캐릭터 (character.ai 모델 참고).

  ### 3. 감정 여정 6단계
  호기심 → 몰입 → 발견 → 성찰 → 공유 → 재탐색.
  각 단계별 색상/모션/타이포그래피 패턴 정의.
  발견 단계에서 색상 전환 필요 (spark #F59E0B 추가 제안).

  ### 4. 진입점 5개
  A: 성격검사 (현재)
  B: 고민 상담 (신규)
  C: 관계 질문 (신규)
  D: SNS 유입 콘텐츠 (신규)
  E: 직업/강점 (신규)

  ### 5. 기술 경계
  CSS scroll-snap: 현재 스택으로 완전 구현 가능
  공유 이미지: 단기는 OG 이미지, 중기 Cloudinary 연동
  AI 캐릭터: Phase 3, Turbo Stream + AI API 스트리밍

  ## 참고 서비스
  토스 (카드 UI 리듬), 카카오뷰 (피드 소비), 잼라이브 (흥분 빌드업)

implications: |
  1. 다음 작업: results/show.html.erb 카드 피드 리팩토링이 우선 구현 대상
  2. 캐릭터 SVG 에셋 제작 필요 (외부 협업 or 오픈소스)
  3. 색상 팔레트에 spark (#F59E0B), ember (#FB7185) 추가 검토 필요
  4. 다중 진입점 랜딩 페이지 설계가 Phase 2 핵심 작업
  5. 접근성: 스와이프 키보드 대안 및 prefers-reduced-motion 반드시 적용

