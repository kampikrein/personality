summary: "파운더의 프로젝트 목표점 — 성격 포탈로서 심리학적 깊이로 유입·리텐션, 캐릭터 인터랙션, 궁극적 소셜 커뮤니티"

context: |
  2026-03-15 파운더가 docs/memo.md에 작성한 프로젝트 목표점.
  기존 MVP 설계(005_Plan)의 "법률우선 성격 검사 서비스" 범위를 넘어서는
  중장기 비전과 제품 철학을 정의한다.

details: |
  ## 핵심 비전 5가지

  ### V1. 성격 포탈 (Personality Portal)
  - 단순 MBTI 분류를 넘어서는 심리학적 깊이 있는 분석 제공
  - "MBTI 알려고 왔다가 깊이 있는 심리학 분석에 호감" → 재방문
  - 성격 관련 종합 포탈로서의 포지셔닝

  ### V2. 중독적 리텐션 (Addictive Retention)
  - 쇼츠를 계속 보듯 스와이프하게 되는 콘텐츠 설계
  - "이렇게 하면 더 잘 알 수 있고, 이렇게 하면 해결할 수 있고"
  - 호기심과 기대감으로 계속 서비스에 머무르게 함
  - 가벼운 것부터 무거운 것까지 단계적 깊이 제공

  ### V3. 캐릭터 인터랙션 (Character Interaction)
  - 웹페이지 내 시선을 끄는 캐릭터가 대화를 나눔
  - 초기: 유연하고 복잡한 매크로 수준
  - 중기: 실제 AI agent를 각 유저별 배정
  - character.ai처럼 각 페르소나가 유저 경험 기반 지식 보유
  - "완전한 AI처럼 느껴지게, 또 다른 인격체로 느껴지게"

  ### V4. 소셜 커뮤니티 진화 (Social Community Evolution)
  - 1단계: 정보 취득 웹사이트
  - 2단계: 개인 문제 해결 + 서로 교감
  - 3단계: 좋은 공동체, 커뮤니티 그룹
  - personality 사이트가 소셜 커뮤니티의 "가장 강력한 유입 창구"

  ### V5. 유연한 진입점 (Flexible Entry)
  - 성격검사가 반드시 메인일 필요 없음
  - 고민, 생각, 다양한 진입 경로 가능
  - 홍보/유입 전략도 핵심 과제
  - 어떤 경로로 들어오든 머물게 하는 것이 핵심

  ## 파운더 원문
  파일 경로: docs/memo.md

implications: |
  1. MVP 설계(005)는 V1의 기초만 다루고 있음. V2-V5는 중장기 로드맵에 반영 필요
  2. 모든 에이전트는 "리텐션"과 "깊이 있는 콘텐츠"를 핵심 가치로 인식해야 함
  3. UX 설계 시 "스와이프/쇼츠형" 콘텐츠 소비 패턴을 우선 고려
  4. 콘텐츠 설계 시 "가벼운 것 → 무거운 것" 깊이 단계를 명시적으로 구조화
  5. 캐릭터/AI 인터랙션은 기술적 복잡도가 높으므로 단계적 구현 계획 필요
  6. 소셜 기능은 MVP 이후이지만, DB/아키텍처에서 확장 가능성을 미리 고려

