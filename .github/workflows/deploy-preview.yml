name: Deploy Preview (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/workers/**"
      - ".github/workflows/deploy-preview.yml"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/workers/package-lock.json
      - name: Install
        working-directory: apps/workers
        run: npm ci
      - name: Type check
        working-directory: apps/workers
        run: npm run type-check
      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          # TODO(Phase 2): Register GitHub Actions secrets
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/workers
          # PR 번호 기반 동적 name — staging env의 D1/KV/R2 bindings 재사용
          command: >
            deploy
            --env staging
            --name personality-workers-pr-${{ github.event.pull_request.number }}
            --route ""
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            // wrangler-action v3 exposes deployment-url output; use if available
            const deploymentUrl = '${{ steps.deploy.outputs.deployment-url }}';
            const fallbackUrl = `https://personality-workers-pr-${context.issue.number}.<ACCOUNT>.workers.dev`;
            // TODO(Phase 2): Replace <ACCOUNT> with actual CF account subdomain
            const url = deploymentUrl || fallbackUrl;
            const body = `Preview deployed: ${url}/health`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
